<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validação dos ângulos do Mokker</title>
<!-- Página de validação (issue #90, rodada 2) — fora do index.html e fora do
     CI publicado. Os 4 ângulos do Mokker lado a lado; com ?teste=1, uma caixa
     magenta substitui o vídeo, no mesmo quadrilátero do matrix3d, para medir
     vazamento (fora do quadrilátero) e cobertura (dentro dele) por pixel. -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; background: #f4f4f2; font-family: system-ui, sans-serif; color: #111; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p.sub { margin: 0 0 32px; color: #555; font-size: 14px; }
  .grade { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
  figure { margin: 0; }
  figcaption { margin-top: 8px; font-size: 13px; color: #555; text-align: center; }

  .mk {
    position: relative; width: 100%; aspect-ratio: var(--w) / var(--h);
    container-type: inline-size;
  }
  .mk__render { display: block; width: 100%; height: 100%; }
  .mk__stage {
    position: absolute; left: 0; top: 0; width: calc(var(--w) * 1px); height: calc(var(--h) * 1px);
    transform-origin: 0 0; transform: scale(var(--k, 1));
  }
  .mk__screen {
    position: absolute; left: 0; top: 0; width: calc(var(--cw) * 1px); height: calc(var(--ch) * 1px);
    transform-origin: 0 0; overflow: hidden; border-radius: calc(var(--raio) * 1px);
  }
  .mk__test { position: absolute; inset: 0; width: 100%; height: 100%; background: #ff00ff; display: none; }
  body.teste-ativo .mk__test { display: block; }
  .mk__notch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
</style>
</head>
<body>
  <h1>Validação dos 4 ângulos do Mokker</h1>
  <p class="sub">Com <code>?teste=1</code>, uma caixa magenta substitui o vídeo no mesmo quadrilátero do <code>matrix3d</code> — mede vazamento (fora) e cobertura (dentro) por pixel. Não entra no CI publicado.</p>
  <div class="grade">

    <figure>
      <div class="mk" data-mk="macbook-esq" style="--w:1255;--h:1141">
        <img class="mk__render" src="../../assets/mokker/idf-br-macbook-esquerda-m.webp" width="1255" height="1141" alt="" loading="lazy" decoding="async">
        <div class="mk__stage" aria-hidden="true">
          <div class="mk__screen" style="--cw:1440;--ch:900;--raio:8.64;transform:matrix3d(0.522657865,-0.153859062,0,7.39206382e-05,0.167071542,0.639809486,0,3.77093713e-05,0,0,1,0,23.6716396,244.67951,0,1)">
            <div class="mk__test"></div>
          </div>
        </div>
        <img class="mk__notch" aria-hidden="true" src="../../assets/mokker/idf-br-macbook-esquerda-m.webp" alt="" style="clip-path: polygon(27.81% 13.45%, 27.21% 13.32%, 27.05% 12.88%, 27.17% 12.40%, 33.59% 10.17%, 33.75% 11.04%, 33.39% 11.44%)">
      </div>
      <figcaption>macbook-esq</figcaption>
    </figure>

    <figure>
      <div class="mk" data-mk="macbook-dir" style="--w:1255;--h:1141">
        <img class="mk__render" src="../../assets/mokker/dvo-macbook-direita-m.webp" width="1255" height="1141" alt="" loading="lazy" decoding="async">
        <div class="mk__stage" aria-hidden="true">
          <div class="mk__screen" style="--cw:1440;--ch:900;--raio:8.64;transform:matrix3d(0.38576995,0.138578583,0,-6.82537561e-05,-0.110642612,0.578526492,0,3.15103589e-05,0,0,1,0,553.950166,20.1303284,0,1)">
            <div class="mk__test"></div>
          </div>
        </div>
        <img class="mk__notch" aria-hidden="true" src="../../assets/mokker/dvo-macbook-direita-m.webp" alt="" style="clip-path: polygon(72.59% 13.45%, 72.11% 13.45%, 66.53% 11.44%, 66.18% 11.04%, 66.25% 10.25%, 66.61% 10.04%, 72.67% 12.23%, 72.95% 12.62%)">
      </div>
      <figcaption>macbook-dir</figcaption>
    </figure>

    <figure>
      <div class="mk" data-mk="iphone-esq" style="--w:339;--h:798">
        <img class="mk__render" src="../../assets/mokker/idf-br-iphone-esquerda-m.webp" width="339" height="798" alt="" loading="lazy" decoding="async">
        <div class="mk__stage" aria-hidden="true">
          <div class="mk__screen" style="--cw:390;--ch:844;--raio:52.65;transform:matrix3d(0.675535135,0.0242745912,0,-0.000175904395,0.0146397629,0.87960513,0,6.62816816e-05,0,0,1,0,13.1664233,22.036475,0,1)">
            <div class="mk__test"></div>
          </div>
        </div>
        <img class="mk__notch" aria-hidden="true" src="../../assets/mokker/idf-br-iphone-esquerda-m.webp" alt="" style="clip-path: polygon(54.57% 8.33%, 35.69% 7.96%, 32.89% 7.02%, 32.60% 5.51%, 34.81% 4.32%, 54.28% 4.70%, 56.78% 5.89%, 56.78% 7.27%)">
      </div>
      <figcaption>iphone-esq</figcaption>
    </figure>

    <figure>
      <div class="mk" data-mk="iphone-dir" style="--w:340;--h:798">
        <img class="mk__render" src="../../assets/mokker/dvo-iphone-direita-m.webp" width="340" height="798" alt="" loading="lazy" decoding="async">
        <div class="mk__stage" aria-hidden="true">
          <div class="mk__screen" style="--cw:390;--ch:844;--raio:52.65;transform:matrix3d(0.796537128,-0.0253457907,0,0.000211741162,0.00990027529,0.955221962,0,7.5684047e-05,0,0,1,0,40.9250727,33.6487636,0,1)">
            <div class="mk__test"></div>
          </div>
        </div>
        <img class="mk__notch" aria-hidden="true" src="../../assets/mokker/dvo-iphone-direita-m.webp" alt="" style="clip-path: polygon(52.94% 8.33%, 45.00% 8.33%, 42.79% 7.02%, 43.09% 5.64%, 45.59% 4.70%, 56.76% 4.32%, 64.71% 4.32%, 66.91% 5.26%, 66.91% 6.77%, 64.71% 7.83%)">
      </div>
      <figcaption>iphone-dir</figcaption>
    </figure>

  </div>
  <script>
    if (new URLSearchParams(location.search).get('teste') === '1') document.body.classList.add('teste-ativo');
    const ro = new ResizeObserver((entries) => {
      for (const { target, contentRect } of entries) {
        const w = parseFloat(getComputedStyle(target).getPropertyValue('--w'));
        target.style.setProperty('--k', contentRect.width / w);
      }
    });
    document.querySelectorAll('.mk').forEach((mk) => ro.observe(mk));
  </script>
</body>
</html>
