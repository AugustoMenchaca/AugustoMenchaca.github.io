name: painel

# Le o grafo de dependencias nativo do GitHub e CALCULA as etapas, em vez de
# depender de milestone atribuida na mao — que desalinha na primeira issue nova.
#
# Etapa de uma issue = maior etapa dos bloqueadores + 1. Etapa 0 nao depende de
# nada. Tudo na mesma etapa e paralelizavel por definicao.
#
# Alcance = quantas issues dependem dela, direta OU indiretamente. Contar so
# dependente direto engana: a #17 tinha 1 direto e 14 transitivos.

on:
  issues:
    types: [opened, closed, reopened, edited, labeled, unlabeled, milestoned, demilestoned]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: painel
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TITULO: 'Painel: por onde comecar'
    steps:
      - name: garantir os rotulos
        run: |
          gh label create pronto  --repo "$REPO" --color 0E8A16 \
            --description "Etapa 0: da para comecar agora" --force
          gh label create bloqueado --repo "$REPO" --color 000000 \
            --description "Espera outra issue fechar" --force

      - name: coletar o grafo
        run: |
          set -euo pipefail
          gh issue list --repo "$REPO" --state open --limit 200 \
            --json number,title,labels,milestone \
            --jq '.[] | select(.title != env.TITULO)
                  | {n: .number, t: .title, l: [.labels[].name],
                     m: (.milestone.title // null)}' > issues.ndjson

          : > grafo.ndjson
          while read -r linha; do
            n=$(echo "$linha" | jq -r .n)
            bl=$(gh api "repos/$REPO/issues/$n/dependencies/blocked_by" \
                   --jq '[.[] | select(.state == "open") | .number]' 2>/dev/null || echo '[]')
            echo "$linha" | jq -c --argjson bl "$bl" '. + {bl: $bl}' >> grafo.ndjson
          done < issues.ndjson
          echo "coletadas $(wc -l < grafo.ndjson) issues"

      - name: calcular etapas e montar o painel
        run: |
          node <<'JS'
          const fs = require('fs');
          const nos = fs.readFileSync('grafo.ndjson', 'utf8')
            .split('\n').filter(Boolean).map(JSON.parse);
          const porNum = new Map(nos.map(o => [o.n, o]));

          // Etapa: caminho mais longo ate uma issue sem bloqueio.
          const etapa = new Map();
          const calc = (n, visto = new Set()) => {
            if (etapa.has(n)) return etapa.get(n);
            if (visto.has(n)) return 0;                    // ciclo, nao deveria existir
            const bls = (porNum.get(n).bl || []).filter(b => porNum.has(b));
            const v = bls.length ? 1 + Math.max(...bls.map(b => calc(b, new Set([...visto, n])))) : 0;
            etapa.set(n, v);
            return v;
          };
          nos.forEach(o => calc(o.n));

          // Alcance transitivo: quem depende desta, direta ou indiretamente.
          const dependemDe = new Map();
          for (const o of nos) {
            for (const b of o.bl || []) {
              if (!porNum.has(b)) continue;
              if (!dependemDe.has(b)) dependemDe.set(b, []);
              dependemDe.get(b).push(o.n);
            }
          }
          const alcance = (n, visto = new Set()) => {
            for (const m of dependemDe.get(n) || [])
              if (!visto.has(m)) { visto.add(m); alcance(m, visto); }
            return visto.size;
          };

          const NOMES = ['comece aqui', 'fundacao', 'sistema', 'secoes', 'fechamento', 'publicacao'];
          const grupos = new Map();
          for (const o of nos) {
            const e = etapa.get(o.n);
            if (!grupos.has(e)) grupos.set(e, []);
            grupos.get(e).push(o);
          }

          const L = [];
          L.push('Calculado do grafo de dependencias pelo workflow `painel`. Nao edite na mao.');
          L.push('');
          L.push(`**${grupos.get(0)?.length || 0} issues** podem comecar agora, em paralelo. ` +
                 `Profundidade total: **${Math.max(...etapa.values()) + 1} etapas**.`);
          L.push('');

          for (const e of [...grupos.keys()].sort((a, b) => a - b)) {
            const itens = grupos.get(e).sort((a, b) => alcance(b.n) - alcance(a.n) || a.n - b.n);
            const nome = NOMES[e] ? ` — ${NOMES[e]}` : '';
            L.push(`## Etapa ${e}${nome}`);
            L.push('');
            L.push(`${itens.length} issue(s) em paralelo.` +
                   (e === 0 ? ' Nada bloqueia estas.' : ` Espera a etapa ${e - 1} fechar.`));
            L.push('');
            L.push('| destrava | issue | categoria | espera |');
            L.push('|---|---|---|---|');
            for (const o of itens) {
              const a = alcance(o.n);
              const cat = (o.l || []).filter(x => !['pronto', 'bloqueado'].includes(x))[0] || '-';
              const esp = (o.bl || []).length ? o.bl.map(b => '#' + b).join(' ') : '-';
              L.push(`| ${a ? '**' + a + '**' : '-'} | #${o.n} ${o.t} | ${cat} | ${esp} |`);
            }
            L.push('');
          }

          L.push('---');
          L.push('');
          L.push('`destrava` conta dependentes **transitivos**, nao so diretos — e a diferenca importa: ' +
                 'contar direto faria a #17 parecer ter alcance 1 quando ela alimenta 14.');
          L.push('');
          L.push('Ordenado por alcance dentro de cada etapa. O topo da Etapa 0 e o gargalo do projeto.');
          L.push('');
          L.push('Porque de cada dependencia: [ROADMAP.md](../blob/main/ROADMAP.md). ' +
                 'Padrao de trabalho: [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md).');

          fs.writeFileSync('painel.md', L.join('\n'));

          // Divergencia entre etapa calculada e milestone, para nao desalinhar de novo.
          const aviso = nos
            .filter(o => o.m && !o.m.startsWith(`Etapa ${etapa.get(o.n)}`))
            .map(o => `  #${o.n}: calculada Etapa ${etapa.get(o.n)}, milestone "${o.m}"`);
          if (aviso.length) {
            console.log('::warning::Milestone divergindo da etapa calculada:\n' + aviso.join('\n'));
          }

          // Rotulos, por etapa.
          fs.writeFileSync('rotular.sh', nos.map(o =>
            etapa.get(o.n) === 0
              ? `gh issue edit ${o.n} --repo "$REPO" --add-label pronto --remove-label bloqueado || true`
              : `gh issue edit ${o.n} --repo "$REPO" --add-label bloqueado --remove-label pronto || true`
          ).join('\n'));

          console.log(L.join('\n'));
          JS

      - name: aplicar os rotulos
        run: bash rotular.sh

      - name: publicar o painel
        run: |
          set -euo pipefail
          existente=$(gh issue list --repo "$REPO" --state all --limit 200 \
            --search "\"$TITULO\" in:title" --json number,title \
            --jq "[.[] | select(.title == env.TITULO)][0].number // empty")
          if [ -n "$existente" ]; then
            gh issue edit "$existente" --repo "$REPO" --body-file painel.md
            echo "painel atualizado: #$existente"
          else
            url=$(gh issue create --repo "$REPO" --title "$TITULO" --body-file painel.md)
            gh issue pin "${url##*/}" --repo "$REPO" 2>/dev/null || true
            echo "painel criado: $url"
          fi
