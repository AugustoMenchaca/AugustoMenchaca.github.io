<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Página não encontrada — Augusto Menchaca</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111111'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23F6ED6C'/%3E%3C/svg%3E">
<style>
  :root {
    --surface: #FFFFFF;
    --ink: #111111;
    --muted: #626569;
    --sun: #F6ED6C;
    --f-display: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --f-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 24px; text-align: center;
    background: var(--surface); color: var(--ink);
    font-family: var(--f-body); padding: 24px;
  }
  .wordmark { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; letter-spacing: -0.01em; }
  h1 { font-family: var(--f-display); font-weight: 600; font-size: clamp(1.5rem, 4vw, 2.15rem); margin: 0; }
  p { margin: 0; color: var(--muted); }
  a.voltar {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--f-body); font-size: 1rem; color: var(--ink);
    text-decoration: underline; text-underline-offset: 0.2em;
  }
  a.voltar:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<span class="wordmark">AUGUSTO MENCHACA</span>
<h1>Página não encontrada. <span lang="en">Page not found.</span></h1>
<p>O endereço que você tentou acessar não existe.</p>
<a class="voltar" href="/">Voltar para a página inicial ↗</a>
</body>
</html>
