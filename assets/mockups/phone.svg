<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860">
  <defs>
    <!-- Gradiente do titânio escuro -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b3c40" />
      <stop offset="100%" stop-color="#1c1d20" />
    </linearGradient>

    <!-- Filtro para sombra ao redor -->
    <filter id="shadow-blur-phone" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" />
    </filter>

    <!-- Máscara para manter o furo da tela visível e transparente -->
    <mask id="phone-screen-mask">
      <rect x="0" y="0" width="420" height="860" fill="white" />
      <rect x="26" y="26" width="368" height="808" rx="50" fill="black" />
    </mask>

    <clipPath id="phone-screen-clip">
      <rect x="26" y="26" width="368" height="808" rx="50" />
    </clipPath>
  </defs>

  <!-- Sombra no fundo -->
  <rect x="20" y="20" width="380" height="830" rx="64" fill="black" opacity="0.3" filter="url(#shadow-blur-phone)" />

  <!-- Botões de ação e volume (esquerda) e de energia (direita) -->
  <rect x="7" y="200" width="6" height="50" rx="2" fill="#3b3c40" />
  <rect x="7" y="270" width="6" height="50" rx="2" fill="#3b3c40" />
  <rect x="407" y="250" width="6" height="80" rx="2" fill="#3b3c40" />

  <!-- Corpo do aparelho com moldura arredondada -->
  <rect x="10" y="10" width="400" height="840" rx="64" fill="url(#body-grad)" stroke="#55565a" stroke-opacity="0.6" stroke-width="3" mask="url(#phone-screen-mask)" />

  <!-- Ilha dinâmica no topo da tela -->
  <rect x="160" y="44" width="100" height="30" rx="15" fill="black" />
  <!-- Lente / sensor -->
  <circle cx="230" cy="59" r="6" fill="#1f2a3a" />

  <!-- Reflexo sutil de luz na tela -->
  <polygon points="26,26 300,26 26,600" fill="white" opacity="0.04" clip-path="url(#phone-screen-clip)" />
</svg>
